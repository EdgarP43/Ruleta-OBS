name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Integrar Client ID público de Twitch (si está configurado)
        shell: pwsh
        env:
          TWITCH_CLIENT_ID: ${{ vars.TWITCH_CLIENT_ID }}
        run: |
          if ($env:TWITCH_CLIENT_ID) {
            $content = @"
          namespace RuletaObs.App;
          internal static class BuiltInTwitchClientId
          {
              public const string Value = "$env:TWITCH_CLIENT_ID";
          }
          "@
            Set-Content -Path "src/RuletaObs.App/BuiltInTwitchClientId.cs" -Value $content -Encoding utf8
          }
      - run: dotnet restore RuletaObs.slnx
      - run: dotnet build RuletaObs.slnx -c Release --no-restore
      - run: dotnet test RuletaObs.slnx -c Release --no-build