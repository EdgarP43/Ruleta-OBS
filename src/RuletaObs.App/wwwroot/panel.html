<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel de ruleta</title><link rel="stylesheet" href="/assets/app.css?v=11"></head>
<body><main style="max-width:760px"><h1>Panel del creador</h1><p class="muted">La tirada no se descuenta hasta que pulses “Confirmar concluido”.</p>
<section class="card"><h2>Ahora</h2><div id="current" class="big">Sin tirada girada</div><p id="msg" class="warn"></p>
<div class="row"><button id="spin">Girar siguiente</button><button id="confirm">Confirmar concluido</button><button id="confirmNext">Confirmar y siguiente</button><button id="cancel" class="danger">Cancelar</button></div></section>
<section class="card"><h2>Cola abierta</h2><div id="queue"></div></section>
<section class="card"><h2>Canjes esperando</h2><div id="entries"></div></section>
<section class="card"><h2>Historial reciente</h2><div id="history"></div></section>
<section class="card"><h2>Datos</h2><div class="row"><button id="export" class="secondary">Exportar cola</button><button id="shutdown" class="danger">Cerrar Ruleta OBS</button></div><p id="shutdownMsg" class="muted"></p></section>
</main><script src="/assets/panel.js?v=2"></script></body></html>
